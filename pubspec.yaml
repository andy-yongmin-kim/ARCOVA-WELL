name: arcova_well
description: "Arcova Well - Your personal AI wellness companion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # 상태 관리 - Riverpod
  flutter_riverpod: ^2.6.1
  
  # 로컬 저장소 - Hive
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # 공유 수신 - Android Intent (나중에 추가)
  # receive_sharing_intent: ^1.8.1
  
  # URL 열기
  url_launcher: ^6.3.1
  
  # 유틸리티
  intl: ^0.20.2
  path_provider: ^2.1.5
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.2
  
  # In-App Purchase (Google Play 결제)
  in_app_purchase: ^3.2.0

  # Health Connect (Android device health metrics)
  health: ^13.0.0
  firebase_ai: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Hive 코드 생성
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0E1624"
  adaptive_icon_foreground: assets/icon/app_icon.png
  min_sdk_android: 26

flutter_native_splash:
  color: "#0E1624"
  image: assets/icon/app_icon.png
  android: true
  ios: true
  android_12:
    color: "#0E1624"
    image: assets/icon/app_icon.png

flutter:
  uses-material-design: true
